<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CrediGestor</title>
<link rel="canonical" href="https://credigestor-testes.web.app/">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e2e8f0;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
main{max-width:420px}a,button{display:inline-block;margin:8px 4px;padding:12px 18px;border-radius:10px;border:0;background:#22c55e;color:#0f172a;font-weight:700;text-decoration:none;font-size:16px;cursor:pointer}
button{background:#e2e8f0}small{color:#94a3b8}
</style>
</head>
<body>
<main>
<h1>CrediGestor</h1>
<p id="msg">O CrediGestor agora fica em um único endereço. Abrindo…</p>
<a id="go" href="https://credigestor-testes.web.app/">Abrir o CrediGestor</a>
<div id="backup" hidden>
<p><small>Este navegador ainda guarda dados da versão antiga. Baixe uma cópia antes de seguir; ela pode ser importada no app em Backup.</small></p>
<button id="save" type="button">Baixar cópia dos dados</button>
</div>
</main>
<script>
// Endereço único do app (o mesmo que o APK abre).
const TARGET='https://credigestor-testes.web.app/';
// Remove o service worker e o cache da cópia antiga deste endereço.
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
let local={};
try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/credigestor|credgestor/i.test(k))local[k]=localStorage.getItem(k);}}catch(e){}
if(Object.keys(local).length){
  document.getElementById('msg').textContent='O CrediGestor agora fica em um único endereço.';
  document.getElementById('backup').hidden=false;
  document.getElementById('save').onclick=()=>{
    const blob=new Blob([JSON.stringify(local,null,2)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='credigestor-dados-endereco-antigo-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  };
}else{
  location.replace(TARGET);
}
</script>
</body>
</html>
