<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>CrediGestor</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=25" />
  <link rel="stylesheet" href="enhancements.css?v=25" />
  <link rel="stylesheet" href="styles-v26.css?v=261" />
</head>
<body data-v26-locked="true">
  <p id="v261Boot">Preparando o acesso seguro ao CrediGestor… Se esta mensagem permanecer, confira a conexão e recarregue. Seus dados antigos não foram alterados.</p>
  <noscript>Ative o JavaScript para usar o CrediGestor.</noscript>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">GESTÃO DE CRÉDITO</div>
        <h1 id="appTitle">CrediGestor</h1>
      </div>
      <div class="topbar-actions"><button id="accountQuickBtn" class="icon-btn" title="Conta">👤</button><button id="themeQuickBtn" class="icon-btn" title="Trocar tema">◐</button></div>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav bottom-nav-v2" aria-label="Navegação principal">
      <button data-view="dashboard" class="nav-btn active"><span>⌂</span><small>Dashboard</small></button>
      <button data-view="clients" class="nav-btn"><span>👥</span><small>Clientes</small></button>
      <button data-view="loans" class="nav-btn"><span>💰</span><small>Empréstimos</small></button>
      <button data-view="charges" class="nav-btn"><span>✓</span><small>Cobranças</small></button>
      <button data-view="crm" class="nav-btn"><span>☷</span><small>CRM</small></button>
      <button data-view="settings" id="settingsNavBtn" class="nav-btn"><span>⚙</span><small>Config.</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalCard">
      <button class="modal-close" value="cancel" aria-label="Fechar">×</button>
      <div id="modalContent"></div>
    </form>
  </dialog>

  <input id="importInput" type="file" accept=".json,.csv,application/json,text/csv" hidden />
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=261"></script>
  <script src="app.js?v=261"></script>
  <script src="enhancements.js?v=261"></script>
  <script src="backup-csv.js?v=25"></script>
  <script src="features-v5.js?v=261"></script>
  <script src="features-v6.js?v=261"></script>
  <script src="features-v7.js?v=25"></script>

  <script src="features-v10.js?v=25"></script>
  <script src="features-v11.js?v=261"></script>
  <script src="features-v12.js?v=261"></script>
  <script src="features-v13.js?v=25"></script>
  <script src="features-v15.js?v=25"></script>

  <script src="features-v24.js?v=25"></script>
  <script src="features-v25.js?v=261"></script>
  <script src="v26-core.js?v=261"></script>
  <script src="cloud-store-v26.js?v=261"></script>
  <script src="auth-v26.js?v=261"></script>
</body>
</html>
