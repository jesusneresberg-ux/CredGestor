<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>CrediGestor</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=17" />
  <link rel="stylesheet" href="enhancements.css?v=17" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">GESTÃO DE CRÉDITO</div>
        <h1 id="appTitle">CrediGestor</h1>
      </div>
      <div class="topbar-actions"><button id="accountQuickBtn" class="icon-btn" title="Conta">👤</button><button id="themeQuickBtn" class="icon-btn" title="Trocar tema">◐</button></div>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav bottom-nav-v2" aria-label="Navegação principal">
      <button data-view="dashboard" class="nav-btn active"><span>⌂</span><small>Dashboard</small></button>
      <button data-view="clients" class="nav-btn"><span>👥</span><small>Clientes</small></button>
      <button data-view="loans" class="nav-btn"><span>💰</span><small>Empréstimos</small></button>
      <button data-view="charges" class="nav-btn"><span>✓</span><small>Cobranças</small></button>
      <button data-view="crm" class="nav-btn"><span>☷</span><small>CRM</small></button>
      <button data-view="settings" id="settingsNavBtn" class="nav-btn"><span>⚙</span><small>Config.</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalCard">
      <button class="modal-close" value="cancel" aria-label="Fechar">×</button>
      <div id="modalContent"></div>
    </form>
  </dialog>

  <input id="importInput" type="file" accept=".json,.csv,application/json,text/csv" hidden />
  <script src="app.js?v=18"></script>
  <script src="enhancements.js?v=18"></script>
  <script src="backup-csv.js?v=18"></script>
  <script async defer src="https://accounts.google.com/gsi/client"></script>
  <script src="features-v5.js?v=18"></script>
  <script src="features-v6.js?v=18"></script>
  <script src="features-v7.js?v=18"></script>
  <script src="features-v8.js?v=18"></script>
  <script src="features-v10.js?v=18"></script>
  <script src="features-v11.js?v=18"></script>
  <script src="features-v12.js?v=18"></script>
  <script src="features-v13.js?v=18"></script>
  <script src="features-v15.js?v=18"></script>
  <script src="features-v16.js?v=18"></script>
  <script src="features-v17.js?v=18"></script>
  <script src="features-v18.js?v=18"></script>
</body>
</html>
