<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>CrediGestor Mobile</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="enhancements.css?v=2" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">GESTÃO DE CRÉDITO</div>
        <h1 id="appTitle">CrediGestor</h1>
      </div>
      <button id="themeQuickBtn" class="icon-btn" title="Trocar tema">◐</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav bottom-nav-v2" aria-label="Navegação principal">
      <button data-view="dashboard" class="nav-btn active"><span>⌂</span><small>Dashboard</small></button>
      <button data-view="clients" class="nav-btn"><span>👥</span><small>Clientes</small></button>
      <button data-view="loans" class="nav-btn"><span>💰</span><small>Empréstimos</small></button>
      <button data-view="more" id="moreBtn" class="nav-btn"><span>•••</span><small>Mais</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalCard">
      <button class="modal-close" value="cancel" aria-label="Fechar">×</button>
      <div id="modalContent"></div>
    </form>
  </dialog>

  <input id="importInput" type="file" accept="application/json" hidden />
  <script src="app.js?v=2"></script>
  <script src="enhancements.js?v=2"></script>
</body>
</html>
