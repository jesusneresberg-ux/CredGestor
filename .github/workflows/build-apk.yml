name: Gerar APK CrediGestor
on:
  push:
    branches: [main]
    paths: ['MainActivity.java', 'CrediAppIconPlugin.java', 'native-icon-colors.json', 'scripts/prepare-android.cjs', 'capacitor.config.json', 'package.json', '.github/workflows/build-apk.yml']
  workflow_dispatch:
  pull_request:
    paths: ['MainActivity.java', 'CrediBiometricPlugin.java', 'CrediAppIconPlugin.java', 'native-icon-colors.json', 'scripts/prepare-android.cjs', 'capacitor.config.json', 'package.json', '.github/workflows/build-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-33 build-tools;33.0.2
          log-accepted-android-sdk-licenses: false
      - run: npm install --ignore-scripts --package-lock=false
      - run: node scripts/prepare-android.cjs
      - run: npx cap add android
      - run: node scripts/prepare-android.cjs
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: CrediGestor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

