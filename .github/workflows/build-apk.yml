name: Gerar APK CrediGestor
on:
  push:
    branches: [main]
    paths: ['apk/package.json', 'capacitor.config.json', 'MainActivity.java', 'CrediBiometricPlugin.java', 'CrediAppIconPlugin.java', 'native-icon-colors.json', 'scripts/prepare-android.cjs', '.github/workflows/build-apk.yml']
  workflow_dispatch:
  pull_request:
    paths: ['MainActivity.java', 'CrediBiometricPlugin.java', 'CrediAppIconPlugin.java', 'native-icon-colors.json', 'scripts/prepare-android.cjs', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-33 build-tools;33.0.2
          log-accepted-android-sdk-licenses: false
      # O package.json da raiz não é o do APK; usa o manifesto próprio do Capacitor.
      - run: cp apk/package.json package.json && rm -f package-lock.json
      - run: npm install --ignore-scripts --package-lock=false
      - run: node scripts/prepare-android.cjs
      - run: npx cap add android
      - run: node scripts/prepare-android.cjs
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CrediGestor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Publica o APK numa versão do GitHub para baixar direto no celular:
      # https://github.com/jesusneresberg-ux/credgestor/releases/latest/download/CrediGestor.apk
      - if: github.event_name != 'pull_request'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CrediGestor.apk
      - if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: CrediGestor APK ${{ github.run_number }}
          body: APK do CrediGestor. Abre https://credigestor-testes.web.app/
          files: CrediGestor.apk
          make_latest: true
