name: Publicar no Firebase
# Publica firebase-hosting/ em https://credigestor-testes.web.app/ (endereço aberto pelo APK)
# quando a pasta muda no main. Requer o secret FIREBASE_SERVICE_ACCOUNT_CREDIGESTOR_TESTES.
on:
  push:
    branches: [main]
    paths: ['firebase-hosting/**', 'tests/**', 'scripts/enable-password-auth.cjs', 'scripts/configure-account-approval.cjs', 'scripts/account-approval.rules.fragment', '.github/workflows/deploy-firebase.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1 google-auth-library@9.15.1 firebase-tools@13.35.1 @firebase/rules-unit-testing@3.0.4 firebase@10.14.1
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node tests/personal-login.cjs
      - run: node tests/assistant-template.cjs
      - run: node tests/capitalization.cjs
      - run: node tests/firebase-partial-payments.cjs
      - run: node tests/payment-discount-unit.cjs
      - run: node tests/payment-discount.cjs
      - run: node tests/early-close.cjs
      - run: node tests/payment-methods.cjs
      - run: node tests/juros-atraso-diarios.cjs
      - name: Habilitar login por e-mail e senha
        run: node scripts/enable-password-auth.cjs
        env:
          FIREBASE_DEPLOY_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDIGESTOR_TESTES }}
      - name: Proteger aprovação de contas pelo administrador
        run: node scripts/configure-account-approval.cjs
        env:
          FIREBASE_DEPLOY_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDIGESTOR_TESTES }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDIGESTOR_TESTES }}
          projectId: credigestor-testes
          entryPoint: firebase-hosting
          channelId: live
