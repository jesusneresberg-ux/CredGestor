name: Publicar no Firebase
# Publica firebase-hosting/ em https://credigestor-testes.web.app/ (endereço aberto pelo APK)
# quando a pasta muda no main. Requer o secret FIREBASE_SERVICE_ACCOUNT_CREDIGESTOR_TESTES.
on:
  push:
    branches: [main]
    paths: ['firebase-hosting/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar secret da conta de serviço
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDIGESTOR_TESTES }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_CREDIGESTOR_TESTES ausente ou vazio para este repositório."
            exit 1
          fi
          echo "Secret presente: ${#SA} caracteres."
          node -e 'let j;try{j=JSON.parse(process.env.SA)}catch{console.log("::error::Secret não é um JSON válido (cole o arquivo .json inteiro).");process.exit(1)}if(j.type!=="service_account"){console.log("::error::JSON não é de conta de serviço.");process.exit(1)}console.log("JSON válido; project_id:",j.project_id)'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node tests/firebase-partial-payments.cjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDIGESTOR_TESTES }}
          projectId: credigestor-testes
          entryPoint: firebase-hosting
          channelId: live
