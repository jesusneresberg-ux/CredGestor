name: Conceder papel Firebase Rules solicitado
on:
  push:
    branches: [main]
    paths: ['scripts/grant-firebase-rules.cjs', '.github/workflows/grant-firebase-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts google-auth-library@9.15.1
      - name: Conceder somente o papel solicitado
        run: node scripts/grant-firebase-rules.cjs
        env:
          FIREBASE_DEPLOY_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDIGESTOR_TESTES }}
